<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shorts</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>
</head>
<body>
<div class="app" id="appRoot">
<header class="topbar"><div class="topbar__row"><div class="brand"><h1 class="brand__title" id="appTitle">Shorts</h1><div class="brand__meta" id="appMeta">Atualizando validade…</div></div><div class="top-actions"><div class="days-chip" id="daysChip">—</div><button class="icon-button" id="historyButton" aria-label="Continuar assistindo"><svg class="ui-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.8v4.7l3.2 1.9"/></svg><span class="history-dot is-hidden" id="historyDot"></span></button><button class="icon-button search-icon" id="searchButton" aria-label="Buscar Shorts"><svg class="ui-svg" viewBox="0 0 24 24"><circle cx="10.7" cy="10.7" r="5.8"/><path d="M15 15l4.5 4.5"/></svg></button><button class="icon-button" id="settingsButton" aria-label="Configurações"><svg class="ui-svg" viewBox="0 0 24 24"><path d="M5 7.5h14M5 12h14M5 16.5h14"/></svg></button></div></div></header>
<section class="settings-panel is-hidden" id="settingsPanel"><div class="settings-panel__inner"><div class="settings-grid"><div class="settings-stat"><div class="settings-stat__label">Validade</div><div class="settings-stat__value" id="expiryDate">—</div></div><div class="settings-stat"><div class="settings-stat__label">Tempo restante</div><div class="settings-stat__value" id="expiryDays">—</div></div></div><div class="accordion"><button class="accordion__trigger" id="updateAccordionButton"><span>Atualizar lista</span><span id="updateAccordionIcon">⌄</span></button><div class="accordion__body is-hidden" id="updateAccordionBody"><input class="input" id="updateM3uInput" placeholder="Cole o novo M3U / login Xtream"><div class="update-actions"><button class="button" id="updateLoadButton">Ler categorias de Shorts</button><button class="button button--accent" id="updateApplyButton" disabled>Atualizar</button></div><div class="update-status" id="updateStatus">Selecione somente categorias que realmente contenham vídeos verticais.</div><div class="update-groups" id="updateGroups"></div></div></div><div class="accordion"><button class="accordion__trigger" id="favoritesButton"><span>Favoritos</span><span>›</span></button></div></div></section>
<div class="search-wrap" id="searchWrap"><input class="search" id="shortSearch" type="search" autocomplete="off" placeholder="Buscar em Shorts…"></div>
<div class="home-status" id="homeStatus">Mesclando categorias…</div>
<main class="feed-shell"><div class="feed-scroller" id="feedScroller"><div class="feed-spacer" id="feedSpacer"><div class="media-loader"><div class="media-loader__core"><span class="media-loader__ring"></span><span class="media-loader__label">Mesclando Shorts</span></div></div></div></div></main>
</div>
<div class="overlay is-hidden" id="historyView"><div class="overlay__shell"><div class="overlay__head"><button class="back-button" id="historyClose" aria-label="Voltar"><svg class="ui-svg" viewBox="0 0 24 24"><path d="M14.5 6.5L9 12l5.5 5.5M9.5 12H19"/></svg></button><div class="overlay__title">Continuar assistindo</div></div><div class="history-grid" id="historyGrid"></div></div></div>
<div class="overlay is-hidden" id="favoritesView"><div class="overlay__shell"><div class="overlay__head"><button class="back-button" id="favoritesClose" aria-label="Voltar"><svg class="ui-svg" viewBox="0 0 24 24"><path d="M14.5 6.5L9 12l5.5 5.5M9.5 12H19"/></svg></button><div class="overlay__title">Favoritos</div></div><div class="history-grid" id="favoritesGrid"></div></div></div>
<div class="short-player is-hidden" id="shortPlayer"><div class="short-player__stage" id="shortStage"><div class="short-player__frame" id="shortFrame"><video id="shortVideo" controls playsinline preload="metadata"></video><div class="short-player__shade"></div></div><div class="short-player__title" id="shortTitle"></div><div class="short-player__rail"><button class="short-action" id="shortClose" aria-label="Sair"><svg class="action-svg" viewBox="0 0 24 24"><path d="M14.5 6.5L9 12l5.5 5.5M9.5 12H19"/></svg><small>Sair</small></button><button class="short-action" id="arcPrev" aria-label="Arco anterior"><svg class="action-svg" viewBox="0 0 24 24"><path d="M15 6.5L9.5 12 15 17.5"/><path d="M7 6.5v11"/></svg><small>Anterior</small></button><button class="short-action" id="shortArcs" aria-label="Arcos"><svg class="action-svg" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3"/><path d="M9 8.5h6M9 12h6M9 15.5h4"/></svg><small>Arcos</small></button><button class="short-action" id="arcNext" aria-label="Próximo arco"><svg class="action-svg" viewBox="0 0 24 24"><path d="M9 6.5l5.5 5.5L9 17.5"/><path d="M17 6.5v11"/></svg><small>Próximo</small></button><button class="short-action" id="shortFavorite" aria-label="Favoritar"><svg class="action-svg heart-shape" viewBox="0 0 24 24"><path d="M12 19s-7-4.35-7-9.2A3.8 3.8 0 0 1 12 7.7a3.8 3.8 0 0 1 7 2.1C19 14.65 12 19 12 19z"/></svg><small>Favorito</small></button></div><div class="arc-drawer is-hidden" id="arcDrawer"><div class="arc-head" id="arcHead">Arcos de 10 minutos</div><div class="arc-grid" id="arcGrid"></div></div></div></div>
<div class="toast" id="toast"></div>
<script id="app-config" type="application/json">__APP_CONFIG__</script>

<script>(()=>{const BASE="https://raw.githubusercontent.com/HyakkimaruPY/fei-config/main/html-generator/v6.6",CSS=[BASE+'/runtime/shorts/01.css',BASE+'/runtime/shorts/02.css',BASE+'/runtime/shorts/03.css'],JS=[BASE+'/runtime/shorts/01.js',BASE+'/runtime/shorts/02.js',BASE+'/runtime/shorts/03.js'];const cfg=JSON.parse(document.getElementById('app-config').textContent),theme=BASE+'/themes/'+(cfg.theme||'graphene')+'.css',cacheKey=u=>'srh66:'+u;async function get(u){try{const c=localStorage.getItem(cacheKey(u));if(c)return c}catch{}const r=await fetch(u,{cache:'force-cache'});if(!r.ok)throw new Error('HTTP '+r.status+' em '+u);const t=await r.text();try{localStorage.setItem(cacheKey(u),t)}catch{}return t}async function boot(){try{const css=(await Promise.all([...CSS,theme].map(get))).join('\n'),st=document.createElement('style');st.textContent=css;document.head.appendChild(st);const js=(await Promise.all(JS.map(get))).join('\n'),sc=document.createElement('script');sc.textContent=js;document.body.appendChild(sc)}catch(e){document.body.innerHTML='<pre style="white-space:pre-wrap;padding:18px;font-family:system-ui;color:#fff;background:#111;min-height:100vh">Falha ao carregar módulos do app Shorts.\n'+String(e.message||e)+'</pre>'}}boot()})();</script>
</body>
</html>
