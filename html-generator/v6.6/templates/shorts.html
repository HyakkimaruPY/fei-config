<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shorts</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>
<style id="srhBootStyle">html,body{margin:0;min-height:100%;background:#0b1116}body.srh-booting{overflow:hidden}body.srh-booting>*:not(#srhBoot):not(script){visibility:hidden!important}#srhBoot{position:fixed;z-index:2147483647;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 32%,rgba(162,208,236,.10),transparent 30%),linear-gradient(180deg,#0e171e,#08100d);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#eef4f1;transition:opacity .22s ease}#srhBoot.is-done{opacity:0;pointer-events:none}.srh-boot-card{width:min(330px,calc(100vw - 48px));padding:22px;border:1px solid rgba(162,208,236,.20);border-radius:22px;background:rgba(13,24,20,.82);box-shadow:0 26px 80px rgba(0,0,0,.42);backdrop-filter:blur(18px)}.srh-boot-mark{width:38px;height:38px;margin-bottom:17px;border:1px solid rgba(162,208,236,.28);border-radius:13px;display:grid;place-items:center;background:rgba(162,208,236,.06)}.srh-boot-mark:before{content:"";width:15px;height:15px;border:2px solid rgba(238,244,241,.23);border-top-color:#a2d0ec;border-radius:50%;animation:srhBootSpin .72s linear infinite}.srh-boot-title{font-size:18px;font-weight:780}.srh-boot-label{margin-top:5px;color:rgba(238,244,241,.62);font-size:11px}.srh-boot-line{height:5px;margin-top:19px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.09)}.srh-boot-fill{height:100%;width:6%;border-radius:inherit;background:linear-gradient(90deg,#709db9,#c4e4f6);transition:width .18s ease}.srh-boot-foot{display:flex;justify-content:space-between;margin-top:8px;font-size:10px;color:rgba(238,244,241,.55)}.srh-boot-retry{display:none;width:100%;min-height:42px;margin-top:15px;border:1px solid rgba(162,208,236,.28);border-radius:12px;background:rgba(162,208,236,.10);color:#eef4f1;font-weight:700}.srh-boot-card.is-error .srh-boot-retry{display:block}@keyframes srhBootSpin{to{transform:rotate(360deg)}}</style>
</head>
<body class="srh-booting">
<div id="srhBoot" role="status" aria-live="polite"><div class="srh-boot-card" id="srhBootCard"><div class="srh-boot-mark"></div><div class="srh-boot-title" id="srhBootTitle">Shorts</div><div class="srh-boot-label" id="srhBootLabel">Preparando interface…</div><div class="srh-boot-line"><div class="srh-boot-fill" id="srhBootFill"></div></div><div class="srh-boot-foot"><span id="srhBootPhase">Inicializando</span><strong id="srhBootPct">6%</strong></div><button class="srh-boot-retry" id="srhBootRetry" type="button">Tentar novamente</button></div></div>
<div class="app" id="appRoot">
<header class="topbar"><div class="topbar__row"><div class="brand"><h1 class="brand__title" id="appTitle">Shorts</h1><div class="brand__meta" id="appMeta">Atualizando validade…</div></div><div class="top-actions"><div class="days-chip" id="daysChip">—</div><button class="icon-button" id="historyButton" aria-label="Continuar assistindo"><svg class="ui-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.8v4.7l3.2 1.9"/></svg><span class="history-dot is-hidden" id="historyDot"></span></button><button class="icon-button search-icon" id="searchButton" aria-label="Buscar Shorts"><svg class="ui-svg" viewBox="0 0 24 24"><circle cx="10.7" cy="10.7" r="5.8"/><path d="M15 15l4.5 4.5"/></svg></button><button class="icon-button" id="settingsButton" aria-label="Configurações"><svg class="ui-svg" viewBox="0 0 24 24"><path d="M5 7.5h14M5 12h14M5 16.5h14"/></svg></button></div></div></header>
<section class="settings-panel is-hidden" id="settingsPanel"><div class="settings-panel__inner"><div class="settings-grid"><div class="settings-stat"><div class="settings-stat__label">Validade</div><div class="settings-stat__value" id="expiryDate">—</div></div><div class="settings-stat"><div class="settings-stat__label">Tempo restante</div><div class="settings-stat__value" id="expiryDays">—</div></div></div><div class="accordion"><button class="accordion__trigger" id="updateAccordionButton"><span>Atualizar lista</span><span id="updateAccordionIcon">⌄</span></button><div class="accordion__body is-hidden" id="updateAccordionBody"><input class="input" id="updateM3uInput" placeholder="Cole o novo M3U / login Xtream"><div class="update-actions"><button class="button" id="updateLoadButton">Ler categorias de Shorts</button><button class="button button--accent" id="updateApplyButton" disabled>Atualizar</button></div><div class="update-status" id="updateStatus">Selecione somente categorias que realmente contenham vídeos verticais.</div><div class="update-groups" id="updateGroups"></div></div></div><div class="accordion"><button class="accordion__trigger" id="favoritesButton"><span>Favoritos</span><span>›</span></button></div></div></section>
<div class="search-wrap" id="searchWrap"><input class="search" id="shortSearch" type="search" autocomplete="off" placeholder="Buscar em Shorts…"></div><div class="home-status" id="homeStatus">Mesclando categorias…</div><main class="feed-shell"><div class="feed-scroller" id="feedScroller"><div class="feed-spacer" id="feedSpacer"><div class="media-loader"><div class="media-loader__core"><span class="media-loader__ring"></span><span class="media-loader__label">Mesclando Shorts</span></div></div></div></div></main></div>
<div class="overlay is-hidden" id="historyView"><div class="overlay__shell"><div class="overlay__head"><button class="back-button" id="historyClose" aria-label="Voltar"><svg class="ui-svg" viewBox="0 0 24 24"><path d="M14.5 6.5L9 12l5.5 5.5M9.5 12H19"/></svg></button><div class="overlay__title">Continuar assistindo</div></div><div class="history-grid" id="historyGrid"></div></div></div><div class="overlay is-hidden" id="favoritesView"><div class="overlay__shell"><div class="overlay__head"><button class="back-button" id="favoritesClose" aria-label="Voltar"><svg class="ui-svg" viewBox="0 0 24 24"><path d="M14.5 6.5L9 12l5.5 5.5M9.5 12H19"/></svg></button><div class="overlay__title">Favoritos</div></div><div class="history-grid" id="favoritesGrid"></div></div></div>
<div class="short-player is-hidden" id="shortPlayer"><div class="short-player__stage" id="shortStage"><div class="short-player__frame" id="shortFrame"><video id="shortVideo" controls playsinline preload="metadata"></video><div class="short-player__shade"></div></div><div class="short-player__title" id="shortTitle"></div><div class="short-player__rail"><button class="short-action" id="shortClose" aria-label="Sair"><svg class="action-svg" viewBox="0 0 24 24"><path d="M14.5 6.5L9 12l5.5 5.5M9.5 12H19"/></svg><small>Sair</small></button><button class="short-action" id="arcPrev" aria-label="Arco anterior"><svg class="action-svg" viewBox="0 0 24 24"><path d="M15 6.5L9.5 12 15 17.5"/><path d="M7 6.5v11"/></svg><small>Anterior</small></button><button class="short-action" id="shortArcs" aria-label="Arcos"><svg class="action-svg" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3"/><path d="M9 8.5h6M9 12h6M9 15.5h4"/></svg><small>Arcos</small></button><button class="short-action" id="arcNext" aria-label="Próximo arco"><svg class="action-svg" viewBox="0 0 24 24"><path d="M9 6.5l5.5 5.5L9 17.5"/><path d="M17 6.5v11"/></svg><small>Próximo</small></button><button class="short-action" id="shortFavorite" aria-label="Favoritar"><svg class="action-svg heart-shape" viewBox="0 0 24 24"><path d="M12 19s-7-4.35-7-9.2A3.8 3.8 0 0 1 12 7.7a3.8 3.8 0 0 1 7 2.1C19 14.65 12 19 12 19z"/></svg><small>Favorito</small></button></div><div class="arc-drawer is-hidden" id="arcDrawer"><div class="arc-head" id="arcHead">Arcos de 2 minutos</div><div class="arc-grid" id="arcGrid"></div></div></div></div><div class="toast" id="toast"></div>
<script id="app-config" type="application/json">__APP_CONFIG__</script>
<script>
(()=>{
 const BASE="https://raw.githubusercontent.com/HyakkimaruPY/fei-config/main/html-generator/v6.6",REV="shorts-aura-r13";
 const CSS_CORE=[BASE+'/runtime/shorts/01.css',BASE+'/runtime/shorts/02.css',BASE+'/runtime/shorts/03.css'];
 const CSS_PATCHES=[BASE+'/runtime/shorts/04-aura-player-r12.css',BASE+'/runtime/shorts/05-theme-variants-r13.css'];
 const JS_CORE=[BASE+'/runtime/shorts/01.js',BASE+'/runtime/shorts/02.js',BASE+'/runtime/shorts/03.js'];
 const JS_PATCHES=[BASE+'/runtime/shorts/04-proxy-fix.js',BASE+'/runtime/shorts/05-aura-transport-r5.js',BASE+'/runtime/shorts/06-aura-player-r12.js'];
 const cfg=JSON.parse(document.getElementById('app-config').textContent),theme=BASE+'/themes/'+(cfg.theme||'graphene')+'.css',cacheKey=u=>'srh66:'+REV+':'+u,versioned=u=>u+(u.includes('?')?'&':'?')+'v='+encodeURIComponent(REV),boot={root:document.getElementById('srhBoot'),card:document.getElementById('srhBootCard'),label:document.getElementById('srhBootLabel'),phase:document.getElementById('srhBootPhase'),pct:document.getElementById('srhBootPct'),fill:document.getElementById('srhBootFill')};
 document.body.dataset.theme=cfg.theme||'graphene';
 document.getElementById('srhBootTitle').textContent=cfg.appName||'Shorts';
 const assets=[...CSS_CORE,theme,...CSS_PATCHES,...JS_CORE,...JS_PATCHES];let done=0;
 try{const keep='srh66:'+REV+':';for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(k&&k.startsWith('srh66:')&&!k.startsWith(keep))localStorage.removeItem(k)}}catch{}
 function tick(label){done++;const p=Math.min(94,6+Math.round(88*done/assets.length));boot.pct.textContent=p+'%';boot.fill.style.width=p+'%';boot.label.textContent=label}
 async function get(u){try{const c=localStorage.getItem(cacheKey(u));if(c){tick('Preparando módulos locais…');return c}}catch{}const r=await fetch(versioned(u),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status+' em '+u);const t=await r.text();try{localStorage.setItem(cacheKey(u),t)}catch{}tick('Baixando componentes…');return t}
 function finish(){boot.phase.textContent='Pronto';boot.label.textContent='Interface carregada';boot.pct.textContent='100%';boot.fill.style.width='100%';document.body.classList.remove('srh-booting');requestAnimationFrame(()=>requestAnimationFrame(()=>{boot.root.classList.add('is-done');setTimeout(()=>boot.root.remove(),240)}))}
 function fail(e){boot.card.classList.add('is-error');boot.phase.textContent='Falha';boot.label.textContent=String(e?.message||e);boot.pct.textContent='—';boot.fill.style.width='100%';document.getElementById('srhBootRetry').onclick=()=>location.reload()}
 async function bootApp(){try{boot.phase.textContent='Estilo';const css=(await Promise.all([...CSS_CORE,theme,...CSS_PATCHES].map(get))).join('\n'),st=document.createElement('style');st.textContent=css;document.head.appendChild(st);boot.phase.textContent='Runtime';const coreParts=await Promise.all(JS_CORE.map(get)),patch=(await Promise.all(JS_PATCHES.map(get))).join('\n');let js=coreParts.join('\n');const marker=/\ninit\(\);\s*\n\}\)\(\);\s*$/;if(!marker.test(js))throw new Error('Runtime Shorts sem marcador de inicialização esperado.');js=js.replace(marker,'\n'+patch+'\ninit();\n})();');boot.phase.textContent='Montando interface';boot.pct.textContent='97%';boot.fill.style.width='97%';const sc=document.createElement('script');sc.textContent=js;document.body.appendChild(sc);finish()}catch(e){fail(e)}}
 bootApp();
})();
</script>
</body></html>
