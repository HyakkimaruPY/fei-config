<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shorts</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>
<style>html,body{margin:0;min-height:100%;background:#090d12}#srhShortsBoot{position:fixed;z-index:2147483647;inset:0;display:grid;place-items:center;background:#090d12;color:#eef3f7;font:600 13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}.srh-short-boot-card{width:min(280px,calc(100vw - 44px));padding:18px;border:1px solid rgba(255,255,255,.13);border-radius:18px;background:#111820}.srh-short-boot-line{height:4px;margin-top:12px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}.srh-short-boot-fill{height:100%;width:12%;background:#aebbd0;transition:width .18s ease}.srh-short-boot-sub{margin-top:6px;color:#8f9cad;font-size:10px}</style>
</head>
<body>
<div id="srhShortsBoot"><div class="srh-short-boot-card"><div id="srhShortsBootLabel">Carregando Shorts…</div><div class="srh-short-boot-sub" id="srhShortsBootSub">Base modular estável</div><div class="srh-short-boot-line"><div class="srh-short-boot-fill" id="srhShortsBootFill"></div></div></div></div>
<div class="app" id="appRoot">
<header class="topbar"><div class="topbar__row"><div class="brand"><h1 class="brand__title" id="appTitle">Shorts</h1><div class="brand__meta" id="appMeta">Atualizando validade…</div></div><div class="top-actions"><div class="days-chip" id="daysChip">—</div><button class="icon-button" id="historyButton" aria-label="Continuar assistindo"><svg class="ui-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.8v4.7l3.2 1.9"/></svg><span class="history-dot is-hidden" id="historyDot"></span></button><button class="icon-button search-icon" id="searchButton" aria-label="Buscar Shorts"><svg class="ui-svg" viewBox="0 0 24 24"><circle cx="10.7" cy="10.7" r="5.8"/><path d="M15 15l4.5 4.5"/></svg></button><button class="icon-button" id="settingsButton" aria-label="Configurações"><svg class="ui-svg" viewBox="0 0 24 24"><path d="M5 7.5h14M5 12h14M5 16.5h14"/></svg></button></div></div></header>
<section class="settings-panel is-hidden" id="settingsPanel"><div class="settings-panel__inner"><div class="settings-grid"><div class="settings-stat"><div class="settings-stat__label">Validade</div><div class="settings-stat__value" id="expiryDate">—</div></div><div class="settings-stat"><div class="settings-stat__label">Tempo restante</div><div class="settings-stat__value" id="expiryDays">—</div></div></div><div class="accordion"><button class="accordion__trigger" id="updateAccordionButton"><span>Atualizar lista</span><span id="updateAccordionIcon">⌄</span></button><div class="accordion__body is-hidden" id="updateAccordionBody"><input class="input" id="updateM3uInput" placeholder="Cole o novo M3U / login Xtream"><div class="update-actions"><button class="button" id="updateLoadButton">Ler categorias de Shorts</button><button class="button button--accent" id="updateApplyButton" disabled>Atualizar</button></div><div class="update-status" id="updateStatus">Selecione somente categorias que realmente contenham vídeos verticais.</div><div class="update-groups" id="updateGroups"></div></div></div><div class="accordion"><button class="accordion__trigger" id="favoritesButton"><span>Favoritos</span><span>›</span></button></div></div></section>
<div class="search-wrap" id="searchWrap"><input class="search" id="shortSearch" type="search" autocomplete="off" placeholder="Buscar em Shorts…"></div>
<div class="home-status" id="homeStatus">Mesclando categorias…</div>
<main class="feed-shell"><div class="feed-scroller" id="feedScroller"><div class="feed-spacer" id="feedSpacer"><div class="media-loader"><div class="media-loader__core"><span class="media-loader__ring"></span><span class="media-loader__label">Mesclando Shorts</span></div></div></div></div></main>
</div>
<div class="overlay is-hidden" id="historyView"><div class="overlay__shell"><div class="overlay__head"><button class="back-button" id="historyClose" aria-label="Voltar"><svg class="ui-svg" viewBox="0 0 24 24"><path d="M14.5 6.5L9 12l5.5 5.5M9.5 12H19"/></svg></button><div class="overlay__title">Continuar assistindo</div></div><div class="history-grid" id="historyGrid"></div></div></div>
<div class="overlay is-hidden" id="favoritesView"><div class="overlay__shell"><div class="overlay__head"><button class="back-button" id="favoritesClose" aria-label="Voltar"><svg class="ui-svg" viewBox="0 0 24 24"><path d="M14.5 6.5L9 12l5.5 5.5M9.5 12H19"/></svg></button><div class="overlay__title">Favoritos</div></div><div class="history-grid" id="favoritesGrid"></div></div></div>
<div class="short-player is-hidden" id="shortPlayer"><div class="short-player__stage" id="shortStage"><div class="short-player__frame" id="shortFrame"><video id="shortVideo" controls playsinline preload="metadata"></video><div class="short-player__shade"></div></div><div class="short-player__title" id="shortTitle"></div><div class="short-player__rail"><button class="short-action" id="shortClose" aria-label="Sair"><svg class="action-svg" viewBox="0 0 24 24"><path d="M14.5 6.5L9 12l5.5 5.5M9.5 12H19"/></svg><small>Sair</small></button><button class="short-action" id="arcPrev" aria-label="Arco anterior"><svg class="action-svg" viewBox="0 0 24 24"><path d="M15 6.5L9.5 12 15 17.5"/><path d="M7 6.5v11"/></svg><small>Anterior</small></button><button class="short-action" id="shortArcs" aria-label="Arcos"><svg class="action-svg" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3"/><path d="M9 8.5h6M9 12h6M9 15.5h4"/></svg><small>Arcos</small></button><button class="short-action" id="arcNext" aria-label="Próximo arco"><svg class="action-svg" viewBox="0 0 24 24"><path d="M9 6.5l5.5 5.5L9 17.5"/><path d="M17 6.5v11"/></svg><small>Próximo</small></button><button class="short-action" id="shortFavorite" aria-label="Favoritar"><svg class="action-svg heart-shape" viewBox="0 0 24 24"><path d="M12 19s-7-4.35-7-9.2A3.8 3.8 0 0 1 12 7.7a3.8 3.8 0 0 1 7 2.1C19 14.65 12 19 12 19z"/></svg><small>Favorito</small></button></div><div class="arc-drawer is-hidden" id="arcDrawer"><div class="arc-head" id="arcHead">Arcos de 2 minutos</div><div class="arc-grid" id="arcGrid"></div></div></div></div>
<div class="toast" id="toast"></div>
<script id="app-config" type="application/json">__APP_CONFIG__</script>
<script>
(()=>{
  const BASE='https://raw.githubusercontent.com/HyakkimaruPY/fei-config/main/html-generator/v6.6',DIST=BASE+'/dist/r24',boot=document.getElementById('srhShortsBoot'),label=document.getElementById('srhShortsBootLabel'),sub=document.getElementById('srhShortsBootSub'),fill=document.getElementById('srhShortsBootFill');
  async function json(url){const r=await fetch(url+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
  async function text(url,rev){const r=await fetch(url+'?v='+encodeURIComponent(rev),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}
  async function bootApp(){try{label.textContent='Carregando núcleo modular…';fill.style.width='28%';const manifest=await json(DIST+'/manifest.json'),cfg=JSON.parse(document.getElementById('app-config').textContent),theme=BASE+'/themes/'+(cfg.theme||'graphene')+'.css';sub.textContent='Revisão '+manifest.revision;const [css,themeCss]=await Promise.all([text(DIST+'/'+manifest.css,manifest.revision),text(theme,manifest.revision)]);const st=document.createElement('style');st.textContent=css+'\n'+themeCss;document.head.appendChild(st);fill.style.width='68%';label.textContent='Inicializando Shorts…';const js=await text(DIST+'/'+manifest.js,manifest.revision),sc=document.createElement('script');sc.textContent=js;document.body.appendChild(sc);fill.style.width='100%';requestAnimationFrame(()=>requestAnimationFrame(()=>boot.remove()))}catch(e){label.textContent='Falha ao carregar Shorts';sub.textContent=String(e?.message||e);fill.style.width='100%'}}
  bootApp();
})();
</script>
</body>
</html>
