name: Validate CORS proxies

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - 'html-generator/v6.6/runtime/shared/proxy-candidates.json'
      - 'html-generator/v6.6/runtime/shared/proxy-probe.txt'
      - 'scripts/validate_cors_proxies.py'
      - '.github/workflows/validate-cors-proxies.yml'

permissions:
  contents: write

concurrency:
  group: validate-cors-proxies
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate CORS relays
        run: python scripts/validate_cors_proxies.py

      - name: Show validated pool
        run: cat html-generator/v6.6/runtime/shared/proxy-pool.json

      - name: Commit updated pool
        shell: bash
        run: |
          if git diff --quiet -- html-generator/v6.6/runtime/shared/proxy-pool.json; then
            echo 'proxy-pool.json unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add html-generator/v6.6/runtime/shared/proxy-pool.json
          git commit -m 'chore: refresh validated CORS proxy pool'
          # The repository may receive UI/runtime commits while validation is
          # running. Rebase the one-file pool commit before pushing so that a
          # harmless concurrent commit cannot make this maintenance job fail.
          git pull --rebase origin main
          git push origin HEAD:main
